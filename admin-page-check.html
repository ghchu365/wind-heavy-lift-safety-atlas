/* Redesigned technical border - rounded corner dots like HUD overlays */

.technical-border {

    position: absolute;
    width: 10px;
    height: 10px;

    border-radius: 50%;
    box-shadow: 0 0 8px rgba(249, 115, 22, 0.5);
  }

    border-radius: 2px;
    width: 18px;
    height: 18px;
    border-right: none;
    border-bottom: none;
  }
